name: ECS Workflow
on:
  workflow_dispatch:
env:
  working-dir: 'python_uv'
jobs:
  my_build:
    name: fastAPI-app
    runs-on: ubuntu-latest

    steps:
      - name: Checking out our code
        uses: actions/checkout@v6

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "python_uv/pyproject.toml"
      
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Install a specific version of uv.
          version: "0.10.2"
      
      - name: Install the project
        working-directory: ${working-dir}
        run: uv sync --locked --all-extras --dev

      - name: linting the project
        working-directory: ${working-dir}
        run: uv run ruff check .

      - name: formatting checks in the project
        working-directory: ${working-dir}
        run: uv run ruff format --check .
      
      # Source-Level Validation:
      - name: Validate FastAPI app imports correctly
        working-directory: ${working-dir}
        run: |
          uv run python -c "
          from main import app

          assert app is not None

          print('FastAPI app imported successfully!')
          "
      
      - name: Docker Build
        working-directory: ${working-dir}
        run: docker build --platform linux/amd64 -t dantej/fastapi1:latest .

      # Container-Level Validation: check that basic features work and didn't miss to include crucial files
      - name: Container Smoke test (polling with timeout)
        run: |
          docker run -d -p 8000:8000 --name fastapi-smoke dantej/fastapi1:latest

          echo "Waiting for FastAPI container to become healthy..."

          for i in {1..15}; do
            if curl --fail --silent http://localhost:8000/health > /dev/null; then
              echo "Container smoke test passed!"
              docker stop fastapi-smoke
              exit 0
            fi

            echo "Attempt $i failed... retrying in 2 seconds"
            sleep 2
          done

          echo "Container failed smoke test"
          docker logs fastapi-smoke

          docker stop fastapi-smoke

          exit 1