name: ECS Workflow
on:
  workflow_dispatch:
env:
  message: 'conversation'
jobs:
  my_build:
    name: fastAPI-app
    runs-on: ubuntu-latest

    steps:
      - name: Checking out our code
        uses: actions/checkout@v6

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "python_uv/pyproject.toml"
      
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Install a specific version of uv.
          version: "0.10.2"
      
      - name: Install the project
        working-directory: python_uv
        run: uv sync --locked --all-extras --dev

      - name: linting the project
        working-directory: python_uv
        run: uv run ruff check .

      - name: formatting checks in the project
        working-directory: python_uv
        run: uv run ruff format --check .
      
      # Source-Level Validation:
      - name: Validate FastAPI app imports correctly
        working-directory: python_uv
        run: uv run python -c "from main import app; print(app)"
      
      # - name: Docker Build

      
      # Check that basic features work and we didn't miss to include crucial files
      # - name: Container Smoke test 
      #   run: uv run uvicorn main:app --host 0.0.0.0 --port 8000