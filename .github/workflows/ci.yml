name: CI FastApi1 Workflow
on:
  workflow_dispatch:
env:
  WORKING_DIR: python_uv
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/fastapi1
  IMAGE_TAG: ${{ github.run_number }}

# GITHUB_TOKEN permissions:
permissions:
  contents: read
  packages: write

jobs:
  my_build:
    name: fastAPI-app
    runs-on: ubuntu-latest

    steps:
      - name: Checking out our code
        uses: actions/checkout@v6

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: "${{ env.WORKING_DIR }}/pyproject.toml"
      
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          # Install a specific version of uv.
          version: "0.10.2"
      
      - name: Install the project
        working-directory: ${{ env.WORKING_DIR }}
        run: uv sync --locked --all-extras --dev

      - name: linting the project
        working-directory: ${{ env.WORKING_DIR }}
        run: uv run ruff check .

      - name: formatting checks in the project
        working-directory: ${{ env.WORKING_DIR }}
        run: uv run ruff format --check .
      
      # Source-Level Validation:
      - name: Validate FastAPI app imports correctly
        working-directory: ${{ env.WORKING_DIR }}
        # Adding a dummy DATABASE_URL only for the cicd import check:
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: fastApi_db
          DB_USER: dbadmin
          DB_PASSWORD: ChangeMe123
        run: |
          uv run python -c "
          from main import app

          assert app is not None

          print('FastAPI app imported successfully!')
          "
      
      - name: Docker Build
        working-directory: ${{ env.WORKING_DIR }}
        run: docker build --platform linux/amd64 -t $IMAGE_NAME:$IMAGE_TAG .

      # Container-Level Validation: check that basic features work and didn't miss to include crucial files
      - name: Container Smoke test (polling with timeout)
        # Adding a dummy DATABASE_URL only for the cicd import check:
        env:
          DATABASE_URL: postgresql+psycopg://dummy:dummy@localhost:5432/dummy
        run: |
          docker run -d \
            -p 8000:8000 \
            -e DATABASE_URL="$DATABASE_URL" \
            --name fastapi-smoke \
            $IMAGE_NAME:$IMAGE_TAG

          echo "Waiting for FastAPI container to become healthy..."

          for i in {1..15}; do
            if curl --fail --silent http://localhost:8000/health > /dev/null; then
              echo "Container smoke test passed!"
              docker stop fastapi-smoke
              exit 0
            fi

            echo "Attempt $i failed... retrying in 2 seconds"
            sleep 2
          done

          echo "Container failed smoke test"
          docker logs fastapi-smoke

          docker stop fastapi-smoke

          exit 1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Push to GitHub Container Registry
        run: docker push $IMAGE_NAME:$IMAGE_TAG